
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jungle Escape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="topbar">
      <div>
        <h1>🌴 Jungle Escape</h1>
        <p>Run fast. Dodge danger. Collect coins!</p>
      </div>
      <div class="stats">
        <div> SCORE <strong id="score">0</strong></div>
        <div> COINS <strong id="coins">0</strong></div>
      </div>
    </header>

    <section class="stage" id="stage">
      <canvas id="gameCanvas" width="800" height="500"></canvas>

      <div class="overlay" id="overlay">
        <div class="panel">
          <div class="big-icon" id="panelIcon">🏃</div>
          <h2 id="panelTitle">Jungle Escape</h2>
          <p id="panelText">
            Dodge obstacles, collect coins and survive as long as possible!
          </p>
          <button id="startBtn">▶ Start Running</button>
          <p class="hint">Use ← → to move, ↑ to jump, ↓ to slide</p>
        </div>
      </div>
    </section>

    <nav class="controls" aria-label="Game controls">
      <button data-action="left" aria-label="Move left">⬅️</button>
      <button data-action="jump" aria-label="Jump">⬆️ Jump</button>
      <button data-action="slide" aria-label="Slide">⬇️ Slide</button>
      <button data-action="right" aria-label="Move right">➡️</button>
    </nav>

    <p class="footer">Collect gold coins • Avoid rocks and barriers</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
