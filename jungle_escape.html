
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle Escape</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 15px; text-align: center;
  background: #14291c; color: white; font-family: Arial;
}
h1 { color: #ffdf69; }
.stats { margin: 12px; font-weight: bold; }
canvas {
  display: block; width: 100%; max-width: 800px; height: auto;
  margin: auto; border: 3px solid #8ca85a; border-radius: 12px;
}
button {
  margin: 5px; padding: 12px 16px; border: 0;
  border-radius: 9px; background: #ffdf69;
  color: #203020; font-weight: bold; cursor: pointer;
}
#message { color: #ffdf69; font-weight: bold; }
</style>
</head>
<body>

<h1>🌴 Jungle Escape</h1>
<div class="stats">
  Score: <span id="score">0</span> |
  Coins: <span id="coins">0</span>
</div>

<canvas id="game" width="800" height="500"></canvas>

<div>
  <button onclick="move(-1)">⬅ Left</button>
  <button onclick="jump()">⬆ Jump</button>
  <button onclick="slide()">⬇ Slide</button>
  <button onclick="move(1)">Right ➡</button>
</div>

<p id="message">Press Start Game to play!</p>
<button onclick="startGame()">▶ Start / Restart</button>
<p>Keyboard: ← → to move, ↑ to jump, ↓ to slide</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const coinText = document.getElementById("coins");
const message = document.getElementById("message");

const lanes = [280, 400, 520];
let lane, score, coins, items, active, jumping, jumpHeight;
let sliding, jumpVelocity, elapsed, spawnTime, lastTime;

function startGame() {
  lane = 1;
  score = 0;
  coins = 0;
  items = [];
  active = true;
  jumping = false;
  jumpHeight = 0;
  jumpVelocity = 0;
  sliding = 0;
  elapsed = 0;
  spawnTime = 0;
  lastTime = performance.now();
  message.textContent = "Run and collect coins!";
  requestAnimationFrame(loop);
}

function move(d) {
  if (active) lane = Math.max(0, Math.min(2, lane + d));
}

function jump() {
  if (active && !jumping && sliding <= 0) {
    jumping = true;
    jumpVelocity = 12;
  }
}

function slide() {
  if (active && !jumping) sliding = 35;
}

document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))
    e.preventDefault();
  if (e.repeat) return;
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") move(-1);
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") move(1);
  if (e.key === "ArrowUp" || e.key === " ") jump();
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") slide();
});

function background() {
  let g = ctx.createLinearGradient(0,0,0,500);
  g.addColorStop(0,"#8ac6a0");
  g.addColorStop(1,"#24502d");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,800,500);

  // Jungle trees
  for (let i=0; i<12; i++) {
    let y = (i*65 + elapsed*0.15) % 500;
    for (let x of [30,90,710,770]) {
      ctx.fillStyle = "#654326";
      ctx.fillRect(x-5,y,10,30);
      ctx.fillStyle = i%2 ? "#246239" : "#347b3e";
      ctx.beginPath();
      ctx.arc(x,y,22,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Running track
  ctx.fillStyle = "#b69a6a";
  ctx.beginPath();
  ctx.moveTo(340,140);
  ctx.lineTo(460,140);
  ctx.lineTo(700,500);
  ctx.lineTo(100,500);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#f3d9a3";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(380,140); ctx.lineTo(350,500);
  ctx.moveTo(420,140); ctx.lineTo(450,500);
  ctx.stroke();
}

function spawnItem() {
  const r = Math.random();
  items.push({
    lane: Math.floor(Math.random()*3),
    y: 150,
    type: r < 0.4 ? "coin" : r < 0.7 ? "rock" : "barrier",
    done: false
  });
}

function drawItems() {
  for (const o of items) {
    const x = lanes[o.lane];
    ctx.save();
    ctx.translate(x,o.y);

    if (o.type === "coin") {
      ctx.fillStyle = "#ffd12d";
      ctx.beginPath();
      ctx.arc(0,0,13,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = "#fff2a0";
      ctx.lineWidth = 4;
      ctx.stroke();
    } else if (o.type === "rock") {
      ctx.fillStyle = "#68645a";
      ctx.beginPath();
      ctx.moveTo(-22,15);
      ctx.lineTo(-16,-12);
      ctx.lineTo(0,-22);
      ctx.lineTo(19,-10);
      ctx.lineTo(23,15);
      ctx.fill();
    } else {
      ctx.fillStyle = "#8a4c25";
      ctx.fillRect(-26,-12,52,30);
      ctx.fillStyle = "#d6a35e";
      ctx.fillRect(-26,-12,52,7);
    }

    ctx.restore();
  }
}

function drawPlayer() {
  const x = lanes[lane];
  const y = 420 - jumpHeight;

  ctx.save();
  ctx.translate(x,y);

  if (sliding > 0) {
    ctx.fillStyle = "#e5a16c";
    ctx.beginPath();
    ctx.arc(18,-12,10,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#e24b32";
    ctx.fillRect(-20,-15,38,15);
  } else {
    ctx.strokeStyle = "#273f99";
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(-6,10); ctx.lineTo(-12,29);
    ctx.moveTo(6,10); ctx.lineTo(12,29);
    ctx.stroke();

    ctx.fillStyle = "#e34e35";
    ctx.fillRect(-12,-15,24,30);

    ctx.fillStyle = "#e7a16b";
    ctx.beginPath();
    ctx.arc(0,-27,12,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#3b281e";
    ctx.beginPath();
    ctx.arc(0,-31,12,Math.PI,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function update(dt) {
  elapsed += dt;
  score += dt * 0.01;
  spawnTime += dt;

  if (spawnTime > Math.max(400,1000-elapsed*0.003)) {
    spawnItem();
    spawnTime = 0;
  }

  if (jumping) {
    jumpHeight += jumpVelocity * dt * 0.06;
    jumpVelocity -= 0.55 * dt * 0.06;
    if (jumpHeight <= 0) {
      jumpHeight = 0;
      jumping = false;
      jumpVelocity = 0;
    }
  }

  if (sliding > 0) sliding -= dt * 0.06;

  for (const o of items) {
    o.y += (3 + Math.min(5,elapsed/10000)) * dt * 0.055;

    if (!o.done && o.lane === lane && o.y > 390 && o.y < 430) {
      if (o.type === "coin") {
        coins++;
        score += 10;
        o.done = true;
      } else if (o.y > 395 && o.y < 425) {
        if (o.type === "rock" && jumpHeight > 30) continue;
        if (o.type === "barrier" && sliding > 0) continue;
        active = false;
        message.textContent =
          "Game Over! Score: " + Math.floor(score) +
          " | Coins: " + coins + ". Press Restart!";
      }
    }
  }

  items = items.filter(o => o.y < 530 && !o.done);
  scoreText.textContent = Math.floor(score);
  coinText.textContent = coins;
}

function draw() {
  background();
  drawItems();
  drawPlayer();
}

function loop(now) {
  if (!active) {
    draw();
    return;
  }

  const dt = Math.min(now-lastTime,40);
  lastTime = now;
  update(dt);
  draw();

  if (active) requestAnimationFrame(loop);
}

background();
drawPlayer();
</script>
</body>
</html>
